<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DS 记忆</title>
<style>
  :root {
    --bg: #14161c;
    --panel: #1b1e26;
    --panel2: #22262f;
    --line: #2e333d;
    --text: #e6e8ee;
    --dim: #9aa2b1;
    --accent: #7c9cff;
    --warn: #f0b45a;
    --bad: #ef6b6b;
    --ok: #57c98a;
    --radius: 10px;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #ffffff;
    --panel: #f6f7f9;
    --panel2: #eceff4;
    --line: #d9dde5;
    --text: #1b1f27;
    --dim: #5b6472;
    --accent: #3b5bdb;
    --warn: #a86400;
    --bad: #c62828;
    --ok: #1e7f4b;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.55 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    padding: 14px 16px 20px;
  }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .brand { font-size: 15px; font-weight: 600; letter-spacing: .5px; }
  .brand small { color: var(--dim); font-weight: 400; margin-left: 6px; }
  .chip {
    border: 1px solid var(--line); background: var(--panel); color: var(--dim);
    padding: 4px 10px; border-radius: 999px; cursor: pointer; font-size: 12px;
  }
  .chip.on { border-color: var(--accent); color: var(--text); background: rgba(124,156,255,.14); }
  .spacer { flex: 1; }
  button {
    border: 1px solid var(--line); background: var(--panel2); color: var(--text);
    padding: 5px 12px; border-radius: 7px; cursor: pointer; font-size: 12px;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: rgba(124,156,255,.18); border-color: var(--accent); }
  button.danger { border-color: rgba(239,107,107,.5); color: #ffb3b3; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  nav { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  nav button {
    border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: transparent;
    color: var(--dim); padding: 7px 14px;
  }
  nav button.on { color: var(--text); border-bottom-color: var(--accent); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
  .card h3 { margin: 0 0 6px; font-size: 14px; }
  .card .meta { color: var(--dim); font-size: 12px; }
  .stats { display: flex; gap: 14px; margin-top: 8px; flex-wrap: wrap; }
  .stat b { display: block; font-size: 18px; font-weight: 600; }
  .stat span { color: var(--dim); font-size: 11px; }
  h2.sec { font-size: 13px; color: var(--dim); font-weight: 500; margin: 18px 0 8px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-weight: 500; font-size: 11px; }
  td.actions { white-space: nowrap; text-align: right; }
  td.actions button { padding: 2px 8px; font-size: 11px; }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; border: 1px solid var(--line); color: var(--dim); }
  .tag.hot { color: #ffd39b; border-color: rgba(240,180,90,.4); }
  .tag.cold { color: #9cc6ff; border-color: rgba(124,156,255,.4); }
  .tag.ok { color: var(--ok); border-color: rgba(87,201,138,.4); }
  .tag.bad { color: var(--bad); border-color: rgba(239,107,107,.4); }
  .muted { color: var(--dim); }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: var(--dim); }
  .field { margin-bottom: 12px; }
  .field label { display: block; color: var(--dim); font-size: 12px; margin-bottom: 4px; }
  input[type=text], input[type=password], input[type=number], input[type=date], select, textarea {
    width: 100%; background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 7px; padding: 7px 9px; font: inherit;
  }
  textarea { min-height: 120px; resize: vertical; font-family: ui-monospace, Consolas, monospace; font-size: 12px; line-height: 1.5; }
  input:disabled, textarea:disabled, select:disabled { opacity: .55; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; }
  .panel h3 { margin: 0 0 4px; font-size: 13px; }
  .panel p.hint { color: var(--dim); font-size: 12px; margin: 4px 0 12px; }
  .check { display: flex; align-items: center; gap: 8px; color: var(--text); }
  .check input { width: auto; }
  .diary { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; background: var(--panel); }
  .diary h4 { margin: 0 0 2px; font-size: 13px; }
  .diary .body { margin-top: 8px; white-space: pre-wrap; color: #cfd4de; }
  .chip-cold, .chip-hot, .chip-auto { display: inline-block; font-size: 11px; line-height: 16px; padding: 0 7px; border-radius: 999px; margin-left: 4px; vertical-align: middle; }
  .chip-cold { border: 1px solid rgba(120,160,255,.55); color: #8fb0ff; background: rgba(120,160,255,.12); }
  .chip-hot { border: 1px solid rgba(120,230,160,.45); color: #7fe0a0; background: rgba(120,230,160,.1); }
  .chip-pending { border: 1px solid rgba(255,200,100,.55); color: #ffcf7a; background: rgba(255,200,100,.12); }
  .chip-freeze { border: 1px solid rgba(160,160,170,.5); color: #a8a8b4; background: rgba(160,160,170,.1); }
  .chip-auto { border: 1px solid var(--line); color: var(--dim); background: transparent; }
  .empty { color: var(--dim); padding: 26px 0; text-align: center; }
  .skill-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .skill-row:last-child { border-bottom: 0; }
  .skill-row b { font-size: 13px; }
  .skill-row .muted { font-size: 12px; }
  .skill-row select { width: auto; min-width: 96px; }
  pre { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: #262b36; border: 1px solid var(--line); color: var(--text);
    padding: 8px 16px; border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity .18s;
    max-width: 80vw; z-index: 50;
  }
  #toast.show { opacity: 1; }
  #toast.err { border-color: rgba(239,107,107,.6); }
  dialog {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 12px; padding: 18px 20px; width: min(680px, 92vw);
  }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  dialog h3 { margin: 0 0 12px; font-size: 14px; }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .flex { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .split { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .split .spacer { flex: 1; }
  @media (max-width: 820px) {
    .preset-table th:nth-child(3), .preset-table td:nth-child(3),
    .preset-table th:nth-child(4), .preset-table td:nth-child(4) { display: none; }
  }
  /* ---- 用户画像：标签胶囊，点开才编辑 ---- */
  .entry-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 12px; }  .entry-chip {
    --chip: var(--accent);
    border: 1px solid color-mix(in srgb, var(--chip) 55%, var(--line));
    background: color-mix(in srgb, var(--chip) 14%, transparent);
    color: color-mix(in srgb, var(--chip) 82%, var(--text));
    border-radius: 999px; padding: 5px 14px; font-size: 12.5px; cursor: pointer;
  }
  .entry-chip:hover { border-color: var(--chip); }
  .entry-chip.on { box-shadow: 0 0 0 2px color-mix(in srgb, var(--chip) 45%, transparent); }
  .entry-chip.add { border-style: dashed; color: var(--dim); background: transparent; }
  .entry-editor { display: none; border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--panel2); margin-bottom: 10px; }
  .entry-editor.on { display: block; }
  .entry-editor .entry-head { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .entry-editor .entry-head input[type=text] { width: auto; flex: 1; min-width: 160px; }
  .entry-editor .entry-head input#ent-tag { max-width: 220px; font-weight: 600; }
  .entry-editor textarea {
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 12.5px; min-height: 90px; line-height: 1.6;
  }
  .io-box { display: none; margin-top: 10px; border: 1px dashed var(--line); border-radius: 8px; padding: 12px; background: var(--panel2); }
  .io-box.on { display: block; }
  .io-box .flex { margin-top: 8px; }
.selected-role { outline: 2px solid #819cff; } button.card { color: inherit; text-align: left; cursor: pointer; }
</style>
</head>
<body>
<header>
  <div class="brand">DS 记忆<small>DSH · 人设与记忆</small></div>
  <div class="spacer"></div>
  <button onclick="window.open('/plugins/dsh-wrx-memory/ui', 'lease-wrx-settings', 'popup,width=1280,height=900,noopener')">独立窗口 ↗</button>
  <button id="btn-summary" class="primary" title="从上次进度继续，按周期补总结">立即总结</button>
  <button id="btn-refresh">刷新</button>
</header>

<nav id="tabs"></nav>
<main id="view"><div class="empty">加载中…</div></main>
<div id="toast"></div>

<dialog id="dlg">
  <h3 id="dlg-title">编辑</h3>
  <div id="dlg-body"></div>
  <div class="dlg-actions">
    <button id="dlg-cancel">取消</button>
    <button id="dlg-save" class="primary">保存</button>
  </div>
</dialog>

<script>
(function detectTheme() {
  const root = document.documentElement;
  const apply = () => {
    let theme = 'dark';
    try {
      if (window.parent && window.parent !== window) {
        const doc = window.parent.document;
        const pRoot = doc.documentElement;
        const pBody = doc.body;
        const bg = (pBody && getComputedStyle(pBody).backgroundColor) || '';
        const m = bg.match(/rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/);
        const flags = [pRoot.dataset.theme, pRoot.dataset.colorScheme, pRoot.className, getComputedStyle(pRoot).colorScheme].join(' ');
        if (m) theme = (0.299 * +m[1] + 0.587 * +m[2] + 0.114 * +m[3]) < 128 ? 'dark' : 'light';
        else if (/dark/i.test(flags)) theme = 'dark';
        else if (/light/i.test(flags)) theme = 'light';
      }
    } catch { /* 跨域或独立打开时用默认深色 */ }
    root.dataset.theme = theme;
  };
  apply();
  try {
    if (window.parent && window.parent !== window) {
      new MutationObserver(apply).observe(window.parent.document.documentElement, { attributes: true, attributeFilter: ['class', 'data-theme', 'data-color-scheme', 'style'] });
    }
  } catch { /* ignore */ }
})();

const API = '/plugins/dsh-wrx-memory/api';
const S = {
  config: null,
  characters: [],
  batches: [],
  char: '',
  tab: location.hash === '#compat' ? 'compat' : 'overview',
  kind: '',
  rows: [],
  diaries: [],
  activity: [],
  user: null,
  prompts: null,
  providers: [],
  defaultSelection: null,
  busy: false,
  dialogMode: null,
  editingIdx: -1,
};

const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (v) => {
  if (!v) return '—';
  const d = new Date(v);
  if (Number.isNaN(d.getTime())) return esc(v);
  return d.toLocaleString('zh-CN', { hour12: false });
};
const short = (v, n = 90) => {
  const s = String(v ?? '').replace(/\s+/g, ' ').trim();
  return s.length > n ? s.slice(0, n) + '…' : s;
};
const kindLabel = { summary: '概要', person: '人物', item: '物品', agreement: '约定' };
const kindOfId = (id) => String(id || '').split(':')[0];

function toast(message, isError) {
  const el = document.getElementById('toast');
  el.textContent = message;
  el.className = 'show' + (isError ? ' err' : '');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { el.className = ''; }, isError ? 6000 : 2800);
}

function setVectorState(id, text, isError) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = text;
  el.style.color = isError ? '#ff7b72' : '';
}

async function api(path, options = {}) {
  if (S.char && !path.startsWith('/roles') && !path.startsWith('/agent-presets')) path += (path.includes('?') ? '&' : '?') + 'character=' + encodeURIComponent(S.char);
  const res = await fetch(API + path, {
    headers: { 'content-type': 'application/json' },
    ...options,
    body: options.body !== undefined ? JSON.stringify(options.body) : undefined,
  });
  let data;
  try { data = await res.json(); } catch { throw new Error('接口返回不是 JSON（HTTP ' + res.status + '）'); }
  if (!data || data.ok !== true) throw new Error(data?.error || ('HTTP ' + res.status));
  return data;
}

function currentCharacter() {
  return S.characters.find((c) => c.id === S.char) || null;
}

window.addEventListener('hashchange', () => {
  if (location.hash === '#compat') { S.tab = 'compat'; renderTabs(); reloadTab(); }
});

function renderTabs() {
  const tabs = [
    ['overview', '角色看板'], ['userpersona', '用户信息'], ['persona', '角色信息'], ['presets', '预设'], ['memory', '系统记忆'], ['diary', '日记'], ['activity', '自主活动'],
    ['skills', '技能'], ['settings', '设置'], ['compat', '兼容性'],
  ];
  document.getElementById('tabs').innerHTML = tabs.map(([id, label]) =>
    `<button class="${S.tab === id ? 'on' : ''}" data-act="tab" data-id="${id}">${label}</button>`).join('');
}

async function reloadState() {
  const data = await api('/state');
  S.config = data.config;
  S.characters = data.characters;
  S.roles = data.roles || [];
  S.characters = S.characters.map(c => ({ ...c, ...S.roles.find(r => r.id === c.id) }));
  S.batches = data.batches;
  renderRoleCards();
  if (!S.char || !S.characters.some((c) => c.id === S.char)) {
    const withMemory = S.characters.find((c) => c.counts && (c.counts.summary + c.counts.person + c.counts.item + c.counts.agreement) > 0);
    S.char = (withMemory || S.characters.find(c => c.id !== 'default') || S.characters[0] || {}).id || '';
    renderRoleCards();
  }
}

async function reloadTab() {
  const view = document.getElementById('view');
  try {
    if (S.char === 'default' && S.tab !== 'overview') { view.innerHTML = '<div class="empty">Default角色不启用该功能</div>'; return; }
    if (S.tab === 'overview') await renderOverview();
    else if (S.tab === 'persona') await renderCharacter();
    else if (S.tab === 'userpersona') await renderUserPersona();
    else if (S.tab === 'presets') await renderPresets();
    else if (S.tab === 'memory') await renderMemory();
    else if (S.tab === 'diary') await renderDiary();
    else if (S.tab === 'activity') await renderActivity();
    else if (S.tab === 'skills') await renderSkills();
    else if (S.tab === 'settings') await renderSettings();
    else if (S.tab === 'compat') await renderCompat();
  } catch (error) {
    view.innerHTML = `<div class="empty">加载失败：${esc(error.message)}</div>`;
  }
}

/* ---------- 概览 ---------- */

function renderRoleCards() {
  let root = document.getElementById('role-cards');
  if (!root) { root = document.createElement('div'); root.id = 'role-cards'; document.getElementById('tabs').after(root); }
  const cards = S.characters.map((c) => {
    const n = c.counts || {};
    return `<button type="button" class="card ${S.char === c.id ? 'selected-role' : ''}" data-act="select-role" data-id="${esc(c.id)}" aria-pressed="${S.char === c.id}">
      <h3>${esc(c.name)} <span class="mono">${esc(c.id)}</span></h3>
      <div class="meta">称呼：${esc(c.user_name || '—')}</div>
      <div class="stats">
        <div class="stat"><b>${n.summary || 0}</b><span>概要</span></div>
        <div class="stat"><b>${n.person || 0}</b><span>人物</span></div>
        <div class="stat"><b>${n.item || 0}</b><span>物品</span></div>
        <div class="stat"><b>${n.agreement || 0}</b><span>约定</span></div>
        <div class="stat"><b>${n.cold || 0}</b><span>冷记录</span></div>
      </div>
    </button>`;
  }).join('');
  root.innerHTML = '<div class="cards">' + cards + '<button data-act="create-role">＋新建角色</button></div><p class="hint">仅切换插件查看与设置对象；会话角色由 DSH Agent Preset 决定。Default 始终使用 DSH 原生上下文。</p>';
}

async function renderOverview() {
  const view = document.getElementById('view');
  const cfg = S.config || {};
  const batchRows = (S.batches || []).filter(b => b.character_id === S.char).slice(0, 24).map((b) => {
    const cls = b.status === 'done' ? 'ok' : b.status === 'error' ? 'bad' : '';
    const chars = S.characters.find((c) => c.id === b.character_id);
    return `<tr>
      <td>${esc(chars ? chars.name : b.character_id)}</td>
      <td class="mono">${fmt(b.range_start)}<br>${fmt(b.range_end)}</td>
      <td><span class="tag ${cls}">${esc(b.status)}</span>${b.error ? `<div class="mono">${esc(short(b.error, 120))}</div>` : ''}</td>
    </tr>`;
  }).join('');
  view.innerHTML = `
    <div class="panel" id="role-binding">
      <h3>${esc(currentCharacter()?.name || S.char)} · Agent Preset 绑定</h3>
      <p class="hint">一个角色可绑定多个 Preset；一个 Preset 只能属于一个角色。未绑定自动归入 Default。</p>
      <div id="preset-bindings">正在读取 DSH Preset…</div>
      ${S.char === 'default' ? '' : '<label>WRX 编排预设 <select id="role-wrx-preset"></select></label><p class="hint">模板集中保存，每份只能绑定一个角色，复用请先复制。此处保存WRX启用、宿主绑定与模板引用；正文与温度在预设页保存，历史设置在预设页单独保存。一个 DSH Preset 固定对应一个角色，需要其他角色请复制 Preset。</p>'}
      <label><input type="checkbox" id="role-enabled" ${currentCharacter()?.enabled ? 'checked' : ''} ${S.char === 'default' ? 'disabled' : ''}>启用 WRX 上下文编排与记忆采集</label>
      <button data-act="save-role-binding">保存绑定</button>
    </div>
    ${S.char === 'default' ? '<div class="empty">Default角色不启用该功能</div>' : `<div class="panel">
      <h3>自动总结</h3>
      <p class="hint">当前：${cfg.summary?.enabled ? '已启用' : '未启用'} · 周期 ${cfg.summary?.intervalMinutes || 60} 分钟 · 模型 ${esc(cfg.llm?.mode === 'endpoint' ? (cfg.llm?.baseURL + ' / ' + cfg.llm?.model) : (cfg.llm?.provider + ' / ' + cfg.llm?.model))}</p>
      <p class="hint">向量召回与重排：${cfg.vector?.enabled ? '已启用' : '未启用（配置已保留，等上下文注入方案确定后再开）'}</p>
    </div>
    <h2 class="sec">最近批次</h2>
    ${batchRows ? `<table><thead><tr><th>角色</th><th>范围</th><th>状态</th></tr></thead><tbody>${batchRows}</tbody></table>` : '<div class="empty">还没有总结批次</div>'}`}`;
  await renderBindings();
}

async function renderBindings() {
  const [data, catalog] = await Promise.all([api('/agent-presets'), S.char === 'default' ? null : api('/presets')]);
  const role = currentCharacter();
  const selector = document.getElementById('role-wrx-preset');
  if (selector) {
    selector.innerHTML = (catalog?.state?.presets || []).map(preset => `<option value="${esc(preset.id)}">${esc(preset.name)}</option>`).join('');
    selector.value = role?.wrxPresetId || catalog?.state?.active_preset_id || '';
  }
  const presets = new Map((data.presets || []).map(p => [p.id, p]));
  for (const r of S.roles || []) for (const id of r.presetIds || []) if (!presets.has(id)) presets.set(id, { id, name: id + '（宿主暂不可用）' });
  document.getElementById('preset-bindings').innerHTML = [...presets.values()].map(p => {
    const owner = (S.roles || []).find(r => r.id !== S.char && r.presetIds.includes(p.id));
    return `<label style="display:block"><input type="checkbox" name="bound-preset" value="${esc(p.id)}" ${role?.presetIds?.includes(p.id) ? 'checked' : ''} ${owner ? 'disabled' : ''}>${esc(p.name || p.id)} <span class="hint">${esc(p.id)}${owner ? ' · 已绑定 ' + esc(owner.name) : ''}</span></label>`;
  }).join('') || '<p class="hint">宿主未提供 Agent Preset 列表；接入 DSH 后可在此绑定。</p>';
}

/* ---------- 人设与预设提示词 ---------- */

const CHAR_FIELDS = [
  ['name', '角色名'],
  ['user_name', '对用户的称呼'],
  ['personality', '性格'],
  ['background', '背景'],
  ['relationship', '关系'],
  ['speaking_style', '说话风格'],
];
const CHAR_LONG = [

/* ---------- 用户画像：标签胶囊 + 点开编辑 ---------- */

const CHIP_COLORS = ['#7c9cff', '#57c98a', '#f0b45a', '#c792ea', '#4dd0e1', '#ef6b6b', '#9ccc65', '#ba68c8', '#ffd54f', '#4db6ac'];
const chipColor = (i) => CHIP_COLORS[((i % CHIP_COLORS.length) + CHIP_COLORS.length) % CHIP_COLORS.length];

function renderEntryChips(entries, which = 'user') {
  const box = document.getElementById(which === 'self' ? 'self-chips' : 'entry-chips');
  if (!box) return;
  const list = Array.isArray(entries) ? entries : [];
  const on = S.editingWhich === which ? S.editingIdx : -1;
  box.innerHTML = list.map((e, i) =>
    `<button class="entry-chip${on === i ? ' on' : ''}" data-act="edit-entry" data-idx="${i}" data-which="${which}" style="--chip:${chipColor(i)}">${esc(e.tag || '（未命名）')}</button>`
  ).join('') + `<button class="entry-chip add" data-act="add-entry" data-which="${which}">＋ 新标签</button>`;
  const head = document.getElementById(which === 'self' ? 'self-count' : 'entry-count');
  if (head) head.textContent = list.length + ' 个标签';
}

/** 打开某一条的编辑器；idx < 0 表示新建 */
function openEntryEditor(entries, idx, which = 'user') {
  const list = Array.isArray(entries) ? entries : [];
  const isNew = idx < 0;
  const e = isNew ? { tag: '', keywords: [], content: '' } : (list[idx] || { tag: '', keywords: [], content: '' });
  S.editingIdx = isNew ? list.length : idx;
  S.editingWhich = which;
  const box = document.getElementById(which === 'self' ? 'self-editor' : 'entry-editor');
  if (!box) return;
  box.classList.add('on');
  box.innerHTML = `
    <div class="entry-head">
      <input type="text" id="ent-tag" value="${esc(e.tag || '')}" placeholder="标签（主题名）" />
      <input type="text" id="ent-kw" value="${esc((Array.isArray(e.keywords) ? e.keywords : []).join('，'))}" placeholder="关键词，逗号分隔" />
    </div>
    <textarea id="ent-content" placeholder="这一条要记住的具体事实">${esc(e.content || '')}</textarea>
    <div class="flex">
      <button class="primary" data-act="entry-save">存到这一条</button>
      <button data-act="entry-cancel">取消</button>
      ${isNew ? '' : '<button class="danger" data-act="entry-del">删掉这条</button>'}
    </div>`;
  const ta = document.getElementById('ent-content');
  if (ta) {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight + 2, 420) + 'px';
  }
  renderEntryChips(list, which);
}

function closeEntryEditor(which) {
  const w = which || S.editingWhich || 'user';
  const box = document.getElementById(w === 'self' ? 'self-editor' : 'entry-editor');
  if (box) { box.classList.remove('on'); box.innerHTML = ''; }
  S.editingIdx = -1;
  const list = (w === 'self' ? S.self?.entries : S.user?.entries) || [];
  renderEntryChips(list, w);
}

/** 把编辑器内容写回 S.user.entries 或 S.self.entries */
function commitEntryEditor() {
  const which = S.editingWhich || 'user';
  const owner = which === 'self' ? S.self : S.user;
  const entries = Array.isArray(owner?.entries) ? [...owner.entries] : [];
  const tag = (document.getElementById('ent-tag')?.value || '').trim();
  const kw = (document.getElementById('ent-kw')?.value || '').split(/[,，\n]/).map((s) => s.trim()).filter(Boolean);
  const content = (document.getElementById('ent-content')?.value || '').trim();
  if (!tag && !content) throw new Error('标签和正文都空着，没东西可存');
  const idx = S.editingIdx;
  const item = { tag, keywords: kw, content };
  if (idx >= entries.length) entries.push(item);
  else entries[idx] = item;
  owner.entries = entries;
  return entries;
}

/** 整份 JSON → {name, core, entries}，容忍三种写法 */
function parseUserJson(text) {
  const data = JSON.parse(text);
  if (Array.isArray(data)) return { entries: data };
  if (data && Array.isArray(data.entries)) return data;
  if (data && typeof data === 'object' && (data.name || data.core)) return { entries: [] };
  throw new Error('认不出这个 JSON：要 {name,core,entries}、{entries:[…]} 或直接一个数组');
}

function openDialog(title, bodyHtml, mode, onSave) {
  S.dialogMode = { mode, onSave };
  document.getElementById('dlg-title').textContent = title;
  document.getElementById('dlg-body').innerHTML = bodyHtml;
  const saveBtn = document.getElementById('dlg-save');
  saveBtn.textContent = '保存';
  saveBtn.style.display = '';
  document.getElementById('dlg').showModal();
}

function fieldHtml(field, value) {
  const [key, label, type] = field;
  if (type === 'textarea') {
    return `<div class="field"><label>${esc(label)}</label><textarea id="f-${key}" data-key="${key}">${esc(value || '')}</textarea></div>`;
  }
  return `<div class="field"><label>${esc(label)}</label><input type="text" id="f-${key}" data-key="${key}" value="${esc(value || '')}" /></div>`;
}

function openEditor(kind, row) {
  const fields = FIELDS[kind] || [];
  const body = fields.map((f) => fieldHtml(f, row ? row[f[0]] : '')).join('');
  openDialog(row ? `编辑 ${row.id}` : `新增${kindLabel[kind] || ''}记录`, body, row ? 'edit' : 'add', async (values) => {
    if (row) await api('/memory/update', { method: 'POST', body: { character: S.char, id: row.id, fields: values } });
    else await api('/memory/add', { method: 'POST', body: { character: S.char, kind, fields: values } });
    toast('已保存');
    await reloadState();
    await reloadTab();
  });
}

/* ---------- 事件 ---------- */

window.addEventListener('message', event => {
  if (event.origin !== location.origin || event.source !== document.querySelector('iframe')?.contentWindow || event.data?.type !== 'wrx-select-role') return;
  document.querySelector('[data-act="select-role"][data-id="' + CSS.escape(event.data.id) + '"]')?.click();
});

document.addEventListener('click', async (event) => {
  const target = event.target.closest('[data-act]');
  if (!target) return;
  const act = target.dataset.act;
  const id = target.dataset.id;
  try {
    if ((act === 'select-role' || act === 'tab') && document.querySelector('iframe')?.contentWindow?.wrxHasUnsaved?.() && !confirm('放弃尚未保存的预设修改并切换？')) return;
    if (act === 'select-role' || act === 'tab') document.querySelector('iframe')?.contentWindow?.wrxDiscard?.();
    if (act === 'select-role') { S.char = id; await reloadState(); await reloadTab(); return; }
    if (act === 'create-role') {
      const roleId = prompt('角色ID：1–80位小写字母、数字、下划线或短横线'); if (!roleId) return;
      const name = prompt('新角色名称'); if (!name?.trim()) return;
      const result = await api('/roles', { method: 'POST', body: { id: roleId, create: true, name: name.trim(), enabled: false, presetIds: [] } });
      S.char = result.role.id; await reloadState(); await reloadTab(); return;
    }
    if (act === 'save-role-binding') {
      await api('/roles', { method: 'POST', body: { id: S.char, update: true, name: currentCharacter().name, enabled: document.getElementById('role-enabled').checked, wrxPresetId: document.getElementById('role-wrx-preset')?.value || '', presetIds: [...document.querySelectorAll('[name="bound-preset"]:checked')].map(input => input.value) } });
      await reloadState(); await reloadTab(); toast('角色绑定已保存'); return;
    }
    if (act === 'tab') { S.tab = id; renderTabs(); await reloadTab(); return; }
    if (act === 'compat-apply') {
      target.disabled = true;
      toast('正在打补丁…');
      try {
        const r = await api('/compat/apply', { method: 'POST', body: { name: id } });
        const lines = (r.done || []).join('；');
        toast('补丁已成功' + (lines ? '：' + lines : '') + '。请手动重启 DSH 后生效。');
        await renderCompat();
      } catch (e) {
        toast('打补丁失败：' + e.message);
      } finally {
        target.disabled = false;
      }
      return;
    }
    if (act === 'draft-persona' || act === 'draft-user') {
      const skill = act === 'draft-persona' ? 'persona' : 'user';
      toast('正在起草，可能要半分钟…');
      target.disabled = true;
      try {
        const r = await api('/skills/draft', { method: 'POST', body: { skill } });
        await showDraft(r.draft);
      } finally { target.disabled = false; }
      return;
    }
    if (act === 'skill-draft') {
      const skill = target.dataset.id;
      toast('正在起草，可能要半分钟…');
      target.disabled = true;
      try {
        await api('/skills/draft', { method: 'POST', body: { skill } });
        toast('草案好了，去下面「待确认的草案」看看');
        await renderSkills();
      } finally { target.disabled = false; }
      return;
    }
    if (act === 'draft-view') { await viewDraft(id); return; }
    if (act === 'draft-apply') {
      if (!confirm('采用这条草案？会真的写进数据。')) return;
      await api('/skills/apply', { method: 'POST', body: { id, confirmed: true, source: 'ui' } });
      toast('已采用');
      await reloadState();
      await reloadTab();
      return;
    }
    if (act === 'draft-discard') {
      await api('/skills/discard', { method: 'POST', body: { id } });
      toast('已丢弃');
      await reloadTab();
      return;
    }
    if (act === 'kind') { S.kind = id; await renderMemory(); return; }
    if (act === 'add') {
      const kind = S.kind || 'summary';
      openEditor(kind, null);
      return;
    }
    if (act === 'edit') {
      const row = S.rows.find((r) => r.id === id);
      if (row) openEditor(row.kind, row);
      return;
    }
    if (act === 'del') {
      if (!confirm('删除 ' + id + '？此操作不可撤销。')) return;
      await api('/memory/delete', { method: 'POST', body: { character: S.char, id } });
      toast('已删除');
      await reloadState();
      await reloadTab();
      return;
    }
    if (act === 'cool-all') {
      if (!confirm('把当前角色的全部热记忆一次性转冷？')) return;
      target.disabled = true;
      try {
        const r = await api('/memory/cool-all', { method: 'POST', body: { character: S.char } });
        toast('已转冷 ' + r.cooled + ' 条');
        await reloadState();
        await reloadTab();
      } finally { target.disabled = false; }
      return;
    }
    if (act === 'mode') {
      await api('/memory/mode', { method: 'POST', body: { character: S.char, id, mode: target.dataset.mode } });
      toast('记忆状态已更新');
      await reloadTab();
      return;
    }
    if (act === 'diary-gen') {
      const date = document.getElementById('diary-date').value;
      toast('正在写日记，可能要一两分钟…');
      target.disabled = true;
      try {
        await api('/diary/generate', { method: 'POST', body: { character: S.char, date } });
        toast('日记写好了');
        await reloadTab();
      } finally { target.disabled = false; }
      return;
    }
    if (act === 'diary-instant') {
      const sessionId = document.getElementById('instant-session').value.trim();
      if (!sessionId) throw new Error('请填写会话 ID');
      const body = { character: S.char, sessionId, date: document.getElementById('diary-date').value, startTime: document.getElementById('instant-start').value, endTime: document.getElementById('instant-end').value.trim(), scope: document.getElementById('instant-scope').value };
      target.disabled = true;
      toast('正在生成即时日记…');
      try {
        const result = await api('/diary/instant', { method: 'POST', body });
        toast(result.status === 'empty' ? '所选时间段没有聊天正文' : result.status === 'already_processed' ? '相同材料已生成或正在处理中' : '即时日记已保存');
        await reloadTab();
      } finally { target.disabled = false; }
      return;
    }
    if (act === 'save-user') {
      const entries = Array.isArray(S.user?.entries) ? S.user.entries : [];
      await api('/user', { method: 'POST', body: {
        name: document.getElementById('user-name').value,
        core: document.getElementById('user-core').value,
        entries,
      } });
      toast('你的信息已保存（' + entries.length + ' 个标签）');
      return;
    }
    if (act === 'add-entry') {
      const which = target.dataset.which || 'user';
      const list = which === 'self' ? (S.self?.entries || []) : (S.user?.entries || []);
      openEntryEditor(list, -1, which);
      document.getElementById(which === 'self' ? 'self-editor' : 'entry-editor').scrollIntoView({ block: 'nearest' });
      return;
    }
    if (act === 'edit-entry') {
      const which = target.dataset.which || 'user';
      const list = which === 'self' ? (S.self?.entries || []) : (S.user?.entries || []);
      openEntryEditor(list, Number(target.dataset.idx), which);
      document.getElementById(which === 'self' ? 'self-editor' : 'entry-editor').scrollIntoView({ block: 'nearest' });
      return;
    }
    if (act === 'entry-save') {
      const which = S.editingWhich || 'user';
      const entries = commitEntryEditor();
      closeEntryEditor(which);
      renderEntryChips(entries, which);
      toast('已存进草稿（' + entries.length + ' 个标签），别忘了点「保存」');
      return;
    }
    if (act === 'entry-cancel') {
      closeEntryEditor(S.editingWhich || 'user');
      return;
    }
    if (act === 'entry-del') {
      const which = S.editingWhich || 'user';
      const owner = which === 'self' ? S.self : S.user;
      const idx = S.editingIdx;
      const entries = Array.isArray(owner?.entries) ? [...owner.entries] : [];
      if (!Number.isInteger(idx) || !entries[idx]) return;
      const title = entries[idx].tag || '这个标签';
      if (!confirm('删掉「' + title + '」？')) return;
      entries.splice(idx, 1);
      owner.entries = entries;
      closeEntryEditor(which);
      renderEntryChips(entries, which);
      toast('已删（草稿），别忘了点「保存」');
      return;
    }
    if (act === 'save-self') {
      const entries = Array.isArray(S.self?.entries) ? S.self.entries : [];
      await api('/self', { method: 'POST', body: {
        entries,
      } });
      toast('我的画像已保存（' + entries.length + ' 个标签）');
      return;
    }
    if (act === 'import-user' || act === 'export-user') {
      const box = document.getElementById('user-io');
      const text = document.getElementById('user-io-text');
      box.classList.add('on');
      if (act === 'export-user') {
        const doc = {
          name: document.getElementById('user-name').value.trim() || '用户',
          core: document.getElementById('user-core').value,
          entries: Array.isArray(S.user?.entries) ? S.user.entries : [],
        };
        const json = JSON.stringify(doc, null, 2);
        text.value = json;
        try {
          const blob = new Blob([json], { type: 'application/json' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'dsh-user-profile.json';
          a.click();
          setTimeout(() => URL.revokeObjectURL(a.href), 4000);
          toast('已生成 JSON（连同下载），也可以点「复制」');
        } catch {
          toast('已生成 JSON，点「复制」带走');
        }
      }
      box.scrollIntoView({ block: 'nearest' });
      return;
    }
    if (act === 'io-apply') {
      const box = document.getElementById('user-io');
      const text = document.getElementById('user-io-text');
      const parsed = parseUserJson(text.value.trim());
      const entries = Array.isArray(parsed.entries) ? parsed.entries : [];
      if (!entries.length) throw new Error('这份 JSON 里没有 entries');
      if (parsed.name) document.getElementById('user-name').value = parsed.name;
      if (parsed.core) document.getElementById('user-core').value = parsed.core;
      S.user.entries = entries;
      closeEntryEditor('user');
      renderEntryChips(entries, 'user');
      box.classList.remove('on');
      toast('已填入 ' + entries.length + ' 个标签，点「保存」才写进库');
      return;
    }
    if (act === 'io-copy') {
      const text = document.getElementById('user-io-text').value;
      if (!text) throw new Error('这里是空的，先点「导出 JSON」');
      try {
        await navigator.clipboard.writeText(text);
        toast('已复制到剪贴板');
      } catch {
        document.getElementById('user-io-text').select();
        toast('复制被浏览器挡了，已全选，按 Ctrl+C');
      }
      return;
    }
    if (act === 'io-close') {
      document.getElementById('user-io').classList.remove('on');
      return;
    }
    if (act === 'save-config') {
      await api('/config', { method: 'POST', body: { patch: {
        summary: {
          enabled: document.getElementById('sum-enabled').checked,
          intervalMinutes: Number(document.getElementById('sum-interval').value),
          delaySeconds: Number(document.getElementById('sum-delay').value),
        },
        diary: {
          enabled: document.getElementById('diary-enabled').checked,
          hour: Number(document.getElementById('diary-hour').value),
        },
        activity: {
          enabled: document.getElementById('activity-enabled').checked,
          hour: Number(document.getElementById('activity-hour').value),
        },
        profile: {
          enabled: document.getElementById('profile-enabled').checked,
          hour: Number(document.getElementById('profile-hour').value),
        },
        selfProfile: {
          enabled: document.getElementById('selfprofile-enabled').checked,
          hour: Number(document.getElementById('selfprofile-hour').value),
        },
        timezone: document.getElementById('sum-tz').value,
        dbPath: document.getElementById('sum-db').value.trim(),
      } } });
      toast('记忆总结设置已保存');
      await reloadState();
      await reloadTab();
      return;
    }
    if (act === 'save-inject') {
      await api('/config', { method: 'POST', body: { patch: { tavern: {
        enabled: document.getElementById('tavern-enabled').checked,
        presetId: document.getElementById('tavern-preset').value,
        inject: {
          hotMemory: document.getElementById('inj-hotmemory').checked,
          coldMemory: document.getElementById('inj-coldmemory').checked,
          hotDiary: document.getElementById('inj-hotdiary').checked,
          coldDiary: document.getElementById('inj-colddiary').checked,
          hotActivity: document.getElementById('inj-hotactivity').checked,
          coldActivity: document.getElementById('inj-coldactivity').checked,
        },
      } } } });
      toast('注入范围已保存');
      await reloadState();
      return;
    }
    if (act === 'save-llm') {
      await api('/config', { method: 'POST', body: { patch: { llm: {
        mode: document.getElementById('llm-mode').value,
        provider: document.getElementById('llm-provider').value,
        model: document.getElementById('llm-model').value.trim(),
        baseURL: document.getElementById('llm-base').value.trim(),
        apiKey: document.getElementById('llm-key').value,
        temperature: Number(document.getElementById('llm-temp').value),
      } } } });
      toast('模型设置已保存');
      await reloadState();
      return;
    }
    if (act === 'save-character') {
      const fields = {};
      for (const [k] of [...CHAR_FIELDS, ...CHAR_LONG]) fields[k] = document.getElementById('c-' + k).value;
      await api('/character', { method: 'POST', body: { character: S.char, fields } });
      toast('人设已保存');
      await reloadState();
      await reloadTab();
      return;
    }
    if (act === 'activity-gen') {
      toast('正在生成外出报告…');
      target.disabled = true;
      try {
        await api('/activity/generate', { method: 'POST', body: { character: S.char } });
        toast('生成好了');
        await reloadTab();
      } finally { target.disabled = false; }
      return;
    }
    if (act === 'save-tavern') {
      await api('/config', { method: 'POST', body: { patch: { tavern: {
        enabled: document.getElementById('tavern-enabled').checked,
        presetId: document.getElementById('tavern-preset').value,
      } } } });
      toast('酒馆注入设置已保存');
      await reloadState();
      return;
    }
    if (act === 'save-cold') {
      await api('/config', { method: 'POST', body: { patch: {
        summary: {
          autoColdEnabled: document.getElementById('autocold-enabled').checked,
          autoColdHours: Number(document.getElementById('autocold-hours').value) || 3,
        },
        tavern: {
          coldEnabled: document.getElementById('coldenabled').checked,
          coldCheckHours: Number(document.getElementById('coldcheck-hours').value) || 6,
          diaryDays: Number(document.getElementById('cold-diary-days').value),
          activityDays: Number(document.getElementById('cold-activity-days').value),
          diaryColdTo: document.getElementById('cold-diary-to').value,
          activityColdTo: document.getElementById('cold-activity-to').value,
        },
      } } });
      toast('转冷规则已保存');
      await refreshColdStat();
      return;
    }
    if (act === 'cold-rotate') {
      target.disabled = true;
      try {
        const r = await api('/cold/rotate', { method: 'POST', body: { character: S.char } });
        toast('转冷：' + (r.cold || 0) + ' 条变冷、' + (r.frozen || 0) + ' 条冻结' + (r.pending ? '，' + r.pending + ' 条还在向量化' : ''));
        await refreshColdStat();
        await reloadTab();
      } finally { target.disabled = false; }
      return;
    }
    if (act === 'preview-tavern') {
      const r = await api('/tavern/preview?input=');
      openDialog('酒馆注入预览', `<pre style="white-space:pre-wrap;max-height:60vh;overflow:auto;margin:0;font-size:12px">${esc(r.text || '（空）')}</pre>`, 'tavern-preview', null);
      document.getElementById('dlg-save').style.display = 'none';
      return;
    }
    if (act === 'inspect-request') {
      const r = await api('/debug/last-request');
      const parts = [];
      if (r.injected) parts.push('【酒馆注入段｜' + r.injected.chars + ' 字符】\n' + r.injected.text);
      for (const s of r.system || []) parts.push('【system prompt｜' + s.chars + ' 字符】\n' + s.text);
      for (const m of r.recent || []) parts.push('【' + m.type + '｜' + m.chars + ' 字符】\n' + m.text);
      openDialog('上一轮上下文', `<pre style="white-space:pre-wrap;max-height:65vh;overflow:auto;margin:0;font-size:12px">${esc(parts.join('\n\n') || '（读不到，可能会话还没落盘）')}</pre>`, 'inspect', null);
      document.getElementById('dlg-save').style.display = 'none';
      return;
    }
    if (act === 'save-extras') {
      await api('/config', { method: 'POST', body: { patch: {
        diary: {
          enabled: document.getElementById('diary-enabled').checked,
          hour: Number(document.getElementById('diary-hour').value),
        },
        activity: {
          enabled: document.getElementById('activity-enabled').checked,
          hour: Number(document.getElementById('activity-hour').value),
        },
        summary: {
          autoColdEnabled: document.getElementById('autocold-enabled').checked,
          autoColdMode: 'interval',
          autoColdHours: Number(document.getElementById('autocold-hours').value) || 3,
        },
      } } });
      toast('已保存');
      await reloadState();
      return;
    }
    if (act === 'save-vector') {
      await api('/config', { method: 'POST', body: { patch: { vector: {
        enabled: document.getElementById('vec-enabled').checked,
        apiUrl: document.getElementById('vec-url').value.trim(),
        model: document.getElementById('vec-model').value.trim(),
        apiKey: document.getElementById('vec-key').value,
        threshold: Number(document.getElementById('vec-threshold').value),
        maxResults: Number(document.getElementById('vec-k').value),
        rerankEnabled: document.getElementById('vec-rerank-enabled').checked,
        rerankModel: document.getElementById('vec-rerank-model').value.trim(),
        rerankUrl: document.getElementById('vec-rerank-url').value.trim(),
        rerankKey: document.getElementById('vec-rerank-key').value,
      } } } });
      toast('向量配置已保存');
      await reloadState();
      return;
    }
    if (act === 'vec-check' || act === 'vec-rerank-check') {
      const rerank = act === 'vec-rerank-check';
      const url = document.getElementById(rerank ? 'vec-rerank-url' : 'vec-url').value.trim();
      const r = await api('/vector/check', { method: 'POST', body: { kind: rerank ? 'rerank' : 'embedding', url } });
      if (!r.ok) return toast('地址有问题：' + (r.error || '未知'), true);
      setVectorState(rerank ? 'vec-rerank-state' : 'vec-state',
        `地址合法；实际会请求：${r.endpoint}${r.models ? '（拉模型走 ' + r.models + '）' : ''}${r.localhost ? '；本机地址，注意服务有没有起' : ''}`);
      return;
    }
    if (act === 'vec-models' || act === 'vec-rerank-models') {
      const rerank = act === 'vec-rerank-models';
      const stateId = rerank ? 'vec-rerank-state' : 'vec-state';
      target.disabled = true;
      setVectorState(stateId, '正在拉取模型…');
      try {
        const r = await api('/vector/models', { method: 'POST', body: {
          kind: rerank ? 'rerank' : 'embedding',
          url: document.getElementById(rerank ? 'vec-rerank-url' : 'vec-url').value.trim(),
          key: document.getElementById(rerank ? 'vec-rerank-key' : 'vec-key').value,
        } });
        const select = document.getElementById(rerank ? 'vec-rerank-model-select' : 'vec-model-select');
        select.innerHTML = '<option value="">选一个填入模型</option>' + r.models.map((m) => `<option value="${esc(m)}">${esc(m)}</option>`).join('');
        select.disabled = false;
        setVectorState(stateId, `已拉到 ${r.models.length} 个模型，耗时 ${r.ms}ms：${r.endpoint}`);
      } catch (error) {
        setVectorState(stateId, '拉取失败：' + error.message, true);
        throw error;
      } finally { target.disabled = false; }
      return;
    }
    if (act === 'vec-test' || act === 'vec-rerank-test') {
      const rerank = act === 'vec-rerank-test';
      const stateId = rerank ? 'vec-rerank-state' : 'vec-state';
      target.disabled = true;
      setVectorState(stateId, '正在真实调用一次…');
      try {
        const r = await api('/vector/test', { method: 'POST', body: {
          kind: rerank ? 'rerank' : 'embedding',
          url: document.getElementById(rerank ? 'vec-rerank-url' : 'vec-url').value.trim(),
          key: document.getElementById(rerank ? 'vec-rerank-key' : 'vec-key').value,
          model: document.getElementById(rerank ? 'vec-rerank-model' : 'vec-model').value.trim(),
        } });
        if (rerank) setVectorState(stateId, `精排正常：${r.model}，${r.ms}ms，得分 ${JSON.stringify(r.scores)}`);
        else setVectorState(stateId, `向量正常：${r.model}，${r.ms}ms，维度 ${r.dimensions}`);
        toast('测试通过');
      } catch (error) {
        setVectorState(stateId, '测试失败：' + error.message, true);
        throw error;
      } finally { target.disabled = false; }
      return;
    }
    if (act === 'save-prompts') {
      const prompts = Object.fromEntries([...document.querySelectorAll('[data-prompt-name]')].map(element => [element.dataset.promptName, element.value]));
      await api('/prompts', { method: 'POST', body: { prompts } });
      S.prompts = null;
      toast('提示词已保存');
      await reloadTab();
      return;
    }
    if (act === 'reset-prompts') {
      if (!confirm('用内置默认稿覆盖当前全部后台提示词？此操作会立即保存。')) return;
      const data = await api('/prompts/reset', { method: 'POST', body: {} });
      S.prompts = data.prompts;
      toast('已恢复默认并保存');
      await renderSettings();
      return;
    }
    if (act === 'test-llm') {
      target.disabled = true;
      try {
        const r = await api('/llm/test', { method: 'POST', body: {} });
        toast('连通正常：' + r.text);
      } finally { target.disabled = false; }
      return;
    }
  } catch (error) {
    toast(error.message, true);
  }
});

document.addEventListener('change', async (event) => {
  const el = event.target;
  if (el && el.id === 'user-io-file') {
    const file = el.files && el.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const box = document.getElementById('user-io');
      if (box) box.classList.add('on');
      const area = document.getElementById('user-io-text');
      if (area) area.value = text;
      toast('文件已读入（' + file.name + '），点「解析并填入」');
    } catch (error) {
      toast('读文件失败：' + error.message, true);
    }
    el.value = '';
    return;
  }
  if (el && (el.id === 'vec-model-select' || el.id === 'vec-rerank-model-select')) {
    if (!el.value) return;
    const targetId = el.id === 'vec-model-select' ? 'vec-model' : 'vec-rerank-model';
    document.getElementById(targetId).value = el.value;
    setVectorState(el.id === 'vec-model-select' ? 'vec-state' : 'vec-rerank-state', '已填入 ' + el.value + '，记得点「保存向量配置」');
    return;
  }
  if (el && el.dataset && el.dataset.act === 'skill-mode') {
    const skill = el.dataset.id;
    const mode = el.value;
    try {
      if (mode === 'auto') {
        const mins = prompt('自动模式授权多久？单位分钟，到期自动收回：', '60');
        if (mins === null) { el.value = S.skills?.items?.[skill]?.mode || 'confirm'; return; }
        await api('/skills/grant', { method: 'POST', body: { skill, mode, minutes: Number(mins) || 60 } });
        toast('已授权 ' + (Number(mins) || 60) + ' 分钟');
      } else {
        await api('/skills/grant', { method: 'POST', body: { skill, mode } });
        toast(mode === 'off' ? '已关闭' : '已改为草案确认');
      }
      await reloadTab();
    } catch (error) { toast(error.message, true); }
    return;
  }
});

document.getElementById('dlg-cancel').addEventListener('click', () => document.getElementById('dlg').close());
document.getElementById('dlg-save').addEventListener('click', async () => {
  const handler = S.dialogMode?.onSave;
  if (!handler) return;
  const values = {};
  document.querySelectorAll('#dlg-body [data-key]').forEach((el) => { values[el.dataset.key] = el.value; });
  try {
    await handler(values);
    document.getElementById('dlg').close();
  } catch (error) {
    toast(error.message, true);
  }
});

document.getElementById('btn-refresh').addEventListener('click', async () => {
  try { await reloadState(); await reloadTab(); toast('已刷新'); } catch (error) { toast(error.message, true); }
});

document.getElementById('btn-summary').addEventListener('click', async () => {
  if (!S.char) return toast('先选一个角色', true);
  const btn = document.getElementById('btn-summary');
  btn.disabled = true;
  btn.textContent = '总结中…';
  try {
    const r = await api('/summarize', { method: 'POST', body: { character: S.char } });
    const res = r.result || {};
    toast(`完成 ${res.done || 0} 批，跳过 ${res.skipped || 0} 批，空 ${res.empty || 0} 批` + (res.errors ? `，失败 ${res.errors}` : ''));
    await reloadState();
    if (S.tab === 'overview' || S.tab === 'memory') await reloadTab();
  } catch (error) {
    toast(error.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = '立即总结';
  }
});

(async function init() {
  try {
    await reloadState();
    renderTabs();
    await reloadTab();
  } catch (error) {
    document.getElementById('view').innerHTML = `<div class="empty">初始化失败：${esc(error.message)}</div>`;
  }
})();
</script>
</body>
</html>
